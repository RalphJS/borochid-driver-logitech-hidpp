[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "borochid-driver-logitech-hidpp"
version = "0.1.0"
description = "Borochid driver for Logitech mice speaking HID++ 2.0"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["borochid-service>=0.1,<0.2"]

[project.entry-points."borochid.drivers"]
logitech-hidpp = "borochid_logitech_hidpp.driver:HidppDriver"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
